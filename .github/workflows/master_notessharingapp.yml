# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy JAR app to Azure Web App - NotesSharingApp

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{secrets.DB_USERNAME}}
      DB_PASSWORD: ${{secrets.DB_PASSWORD}}
      EMAIL: ${{secrets.EMAIL}}
      MAIL_PASSWORD: ${{secrets.MAIL_PASSWORD}}
      JWT_KEY: ${{secrets.JWT_KEY}}
      JWT_EXPIRATION: ${{secrets.JWT_EXPIRATION}}
      CLOUDINARY_NAME: ${{secrets.CLOUDINARY_NAME}}
      CLOUDINARY_API_SECRET: ${{secrets.CLOUDINARY_API_SECRET}}
      CLOUDINARY_API_KEY: ${{secrets.CLOUDINARY_API_KEY}}
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Build with Maven
        run: mvn clean install

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '${{ github.workspace }}/target/*.jar'

  deploy:
    runs-on: windows-latest
    env:
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{secrets.DB_USERNAME}}
      DB_PASSWORD: ${{secrets.DB_PASSWORD}}
      EMAIL: ${{secrets.EMAIL}}
      MAIL_PASSWORD: ${{secrets.MAIL_PASSWORD}}
      JWT_KEY: ${{secrets.JWT_KEY}}
      JWT_EXPIRATION: ${{secrets.JWT_EXPIRATION}}
      CLOUDINARY_NAME: ${{secrets.CLOUDINARY_NAME}}
      CLOUDINARY_API_SECRET: ${{secrets.CLOUDINARY_API_SECRET}}
      CLOUDINARY_API_KEY: ${{secrets.CLOUDINARY_API_KEY}}
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3EBAAF437F704B02B6D72BF77A24E105 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_55F5E9B8D0504AE7A0C19F854F1A7D3B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7052EF571AAF48F9BC357A43C81D371C }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'NotesSharingApp'
          slot-name: 'Production'
          package: '*.jar'

          
